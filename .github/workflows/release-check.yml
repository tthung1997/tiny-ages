name: Release check

# Posts a comment on every pull request saying whether a release is due, from what has changed
# since the last tag (game/tools/release_check.ps1). It only suggests; it never tags or publishes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the suggestion
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pwsh -File game/tools/release_check.ps1 -Markdown > release-check.md
          cat release-check.md >> "$GITHUB_STEP_SUMMARY"

      # Edits the same comment on later pushes instead of adding a new one each time.
      - name: Comment on the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file release-check.md --edit-last --create-if-none
